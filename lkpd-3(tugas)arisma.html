<html>
    <head>
        <title>LKPD 3-Tabel</title>
    </head>
    <body>
        <h2>Tabel Piket X ACP</h2>
        <table border="1">
            <tr>
                <th rowspan="2">Hari</th>
                <th colspan="2">Tugas Piket</th>
                <th></th>
            </tr>
            <tr> <!--baris kedua-->
                <th>menyapu</th>
                <th>menghapus papan</th>
            </tr>
            <tr> <!--baris ketiga-->
                <th>senin</th>
                <th>arisma</th>
                <th>allifia</th>
            </tr>
            <tr> <!--baris keempat-->
                <th>selasa</th>
                <th>zahra</th>
                <th>intana</th>
            </tr>
                <tr> <!--baris kelima-->
                  <th>rabu</th>
                  <th>iin</th>
                  <th>desi</th>
                </tr>
                <tr> <!--baris keenam-->  
                    <th>kamis</th>
                    <th>kumala</th>
                    <th>naila</th>
                </tr>
                <tr> <!--baris ketuju-->   
                    <th>jum'at</th>
                    <th>fina</th>
                    <th>cahyati</th>
                </tr>
        </table>
    </body>
</html>
